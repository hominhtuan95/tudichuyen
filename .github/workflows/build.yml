name: Build Auto Train 1NV EXE
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build standalone EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Auto_Train_Mil_Co_Mo_1NV --add-data "header.png;." Auto_Train_1NV.py
      - uses: actions/upload-artifact@v4
        with:
          name: Auto_Train_Mil_Co_Mo_1NV_Windows_EXE
          path: dist/Auto_Train_Mil_Co_Mo_1NV.exe
